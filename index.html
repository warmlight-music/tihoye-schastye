<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тихое счастье — Альбом</title>
<style>
  :root{
    --bg:#f5f0e6; /* Цвет старой бумаги */
    --bg2:#e8dfd1;
    --card:#fff9f0;
    --accent:#a67b5b; /* Тёплый кофейный */
    --accent2:#8c6347;
    --text:#3b2e25; /* Тёмно-коричневый (как чернила) */
    --muted:#8a7b6e;
    --glow:rgba(166,123,91,.2);
  }
  
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  *{box-sizing:border-box;margin:0;padding:0}
  
  body{
    font-family:'Georgia', 'Times New Roman', serif; /* Книжный шрифт */
    background:radial-gradient(circle at 50% 0%,var(--bg) 0%,var(--bg2) 100%);
    color:var(--text); min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:24px 16px 48px; gap:24px;
    width: 100%; max-width: 100vw; overflow-x: hidden;
    -webkit-user-select: none; user-select: none; line-height: 1.5;
  }

  .album { text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; max-width:600px; }
  .album__cover { width:min(280px,72vw); aspect-ratio:1/1; border-radius:12px; object-fit:cover; box-shadow:0 15px 45px var(--glow); border:4px solid #fff; pointer-events: none; }
  .album__title { font-size:clamp(26px,6vw,44px); font-weight:normal; letter-spacing:.02em; color: var(--text); line-height: 1.1; font-style: italic;}
  .album__sub { color:var(--accent); font-size:16px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; font-family: system-ui, sans-serif; }

  .carousel { width:100%; max-width:960px; display:flex; gap:20px; overflow-x:auto; padding:10px 8px 20px; scroll-snap-type:x mandatory; scrollbar-width:thin; scrollbar-color:var(--accent) transparent; }
  .carousel::-webkit-scrollbar { height:6px; }
  .carousel::-webkit-scrollbar-thumb { background:var(--accent); border-radius:4px; }
  
  .track { flex:0 0 auto; width:190px; scroll-snap-align:center; background:var(--card); border-radius:12px; padding:12px; cursor:pointer; transition:transform .2s, box-shadow .2s; border:1px solid rgba(166,123,91,.1); text-align:center; display: flex; flex-direction: column; }
  .track:hover { transform:translateY(-5px); box-shadow: 0 10px 20px var(--glow); }
  .track.active { border:2px solid var(--accent); box-shadow:0 10px 25px var(--glow); }
  
  .track__cover { width:100%; aspect-ratio:1/1; border-radius:8px; object-fit:cover; display:block; margin-bottom:12px; background:var(--bg2); pointer-events: none; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.05);}
  
  .track__num { font-size:11px; color:var(--accent); font-weight:bold; letter-spacing:.1em; margin-bottom:4px; text-transform: uppercase; font-family: system-ui, sans-serif;}
  .track__name { font-size:15px; font-weight:bold; margin-bottom:6px; line-height: 1.2; }
  .track__desc { font-size:12px; color:var(--muted); line-height: 1.3; flex-grow: 1; font-style: italic;}

  .player { width:100%; max-width:600px; background:var(--card); border-radius:16px; padding:24px; display:flex; flex-direction:column; gap:16px; box-shadow:0 15px 50px rgba(0,0,0,.1); border:1px solid rgba(166,123,91,.2); position: sticky; bottom: 10px; z-index: 10;}
  .player__now { display:flex; align-items:center; gap:16px; }
  .player__cover { width:70px; height:70px; border-radius:8px; object-fit:cover; background:var(--bg2); border:2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); pointer-events: none; }
  .player__info { overflow:hidden; flex:1; }
  .player__title { font-weight:bold; font-size:16px; line-height:1.25; margin-bottom:2px; }
  .player__artist { color:var(--muted); font-size:13px; font-family: system-ui, sans-serif;}
  .player audio { width:100%; outline: none; }
  
  .player__nav { display:flex; justify-content:center; gap:16px; font-family: system-ui, sans-serif;}
  .player__nav button { background:var(--accent); border:none; color:#fff; padding:12px 24px; border-radius:30px; font-weight:bold; font-size:14px; cursor:pointer; transition:background 0.3s; box-shadow: 0 4px 10px var(--glow);}
  .player__nav button:hover { background:var(--accent2); }
</style>
</head>
<body>
<!-- Кнопка возврата на главную -->
<a href="https://warmlight-music.github.io/my-music/" class="back-to-main">
    ← Вернуться к дискографии
</a>

<style>
    .back-to-main {
        position: fixed;
        top: 20px;
        left: 20px;
        background-color: #2a211c;
        color: #d4af37;
        padding: 10px 20px;
        border-radius: 30px;
        text-decoration: none;
        font-family: 'Georgia', serif;
        font-size: 14px;
        border: 1px solid #4a3b2f;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        transition: all 0.3s ease;
        z-index: 9999; /* Чтобы кнопка была поверх всего */
    }

    .back-to-main:hover {
        background-color: #d4af37;
        color: #1a1512;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
    }
</style>
  <section class="album">
    <img class="album__cover" id="albumCover" src="cover.jpg" alt="Обложка альбома">
    <h1 class="album__title">Тихое счастье</h1>
    <p class="album__sub">Новый альбом</p>
  </section>

  <div class="carousel" id="carousel"></div>

  <div class="player">
    <div class="player__now">
      <img class="player__cover" id="playerCover" src="cover.jpg" alt="Cover">
      <div class="player__info">
        <div class="player__title" id="playerTitle">Выбери песню</div>
        <div class="player__artist" id="playerArtist">Тихое счастье</div>
      </div>
    </div>
    <audio id="audio" controls controlslist="nodownload" preload="none"></audio>
    <div class="player__nav">
      <button id="prevBtn">⏮ Пред</button>
      <button id="nextBtn">След ⏭</button>
    </div>
  </div>

<script>
  const album = {
    title: "Тихое счастье",
    cover: "cover.jpg",
    tracks: [
      { id: 1, name: "Сила твоих касаний", desc: "Шёпот, ночная поездка." },
      { id: 2, name: "Тёплый звонок", desc: "Просто хотелось услышать." },
      { id: 3, name: "Окрылённая сила", desc: "Переписка и смайлы." },
      { id: 4, name: "Урок или Судьба", desc: "Зачем люди приходят." },
      { id: 5, name: "Без конца", desc: "Чувство без срока давности." },
      { id: 6, name: "Наше продолжение", desc: "Семья и дети." },
      { id: 7, name: "Искусство прощать", desc: "Джаз, умение прощать." },
      { id: 8, name: "Искусство в простом", desc: "Эстрада, кофе и книга." },
      { id: 9, name: "Простые вещи", desc: "Инди-фолк, счастье в моменте." },
      { id: 10, name: "Тихая беседа", desc: "Мандорин-поп, близость душ." }
    ]
  };

  let currentTrack = -1;

  const carousel    = document.getElementById('carousel');
  const audio       = document.getElementById('audio');
  const playerCover = document.getElementById('playerCover');
  const playerTitle = document.getElementById('playerTitle');

  const pad = (n) => String(n).padStart(2,'0');
  
  const coverPath = (id) => `covers/${pad(id)}.jpg`;
  const songPath  = (id) => `${pad(id)}.mp3`;

  function renderCarousel(){
    carousel.innerHTML = '';
    album.tracks.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'track' + (i === currentTrack ? ' active' : '');
      el.dataset.index = i;
      el.innerHTML = `
        <img class="track__cover" src="${coverPath(t.id)}" alt="${t.name}">
        <div class="track__num">ТРЕК №${t.id}</div>
        <div class="track__name">${t.name}</div>
        <div class="track__desc">${t.desc}</div>
      `;
      el.addEventListener('click', () => play(i));
      carousel.appendChild(el);
    });
  }

  function play(i){
    if (i < 0) i = album.tracks.length - 1;
    if (i >= album.tracks.length) i = 0;

    currentTrack = i;
    const t = album.tracks[i];

    playerCover.src = coverPath(t.id);
    playerTitle.textContent = t.name;

    [...carousel.querySelectorAll('.track')].forEach((el, idx) => el.classList.toggle('active', idx === i));
    carousel.children[i]?.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});

    audio.src = songPath(t.id);
    audio.play().catch(()=>{});
  }

  document.getElementById('prevBtn').onclick = () => play(currentTrack - 1);
  document.getElementById('nextBtn').onclick = () => play(currentTrack + 1);
  audio.addEventListener('ended', () => play(currentTrack + 1));

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());

  renderCarousel();
</script>
</body>
</html>
